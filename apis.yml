aid: dataminr
name: Dataminr
description: >-
  Dataminr delivers AI-powered real-time event, threat and risk intelligence,
  detecting breaking events and emerging risks across more than one million
  public data sources using proprietary large language models and multi-modal
  fusion AI. Its product lines span corporate security, cyber defense, public
  sector (First Alert) and newsroom situational awareness, serving government
  agencies and a large share of the Fortune 50. The Dataminr Pulse API exposes
  real-time alert consumption plus watchlist and account management over an
  OAuth2-secured REST gateway (gateway.dataminr.com), enabling integrations with
  SIEM, SOAR and security operations tooling.
